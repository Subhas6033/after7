name: Deploy Backend

on:
  push:
    branches:
      - main
    paths:
      - "Server/**"
      - "deploy/docker/docker-compose.prod.yml"
      - ".github/workflows/deploy-backend.yml"

concurrency:
  group: after7-backend-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e

            echo "========================================"
            echo "After7 Backend Deployment"
            echo "========================================"

            echo "Checking VPS repository..."
            cd /opt/after7/repository

            echo "Updating repository..."
            git fetch origin main
            git checkout main
            git reset --hard origin/main

            echo "Building Docker image..."
            docker build -t after7-server:latest ./Server

            echo "Starting backend container..."
            docker compose -f deploy/docker/docker-compose.prod.yml up -d server

            echo "Waiting for backend to start..."
            sleep 10

            echo "Checking container status..."
            docker compose -f deploy/docker/docker-compose.prod.yml ps server

            echo "Checking backend health..."
            curl --fail --silent --show-error \
              http://127.0.0.1:6866/health \
              > /dev/null

            echo "========================================"
            echo "After7 backend deployment successful."
            echo "========================================"
