name: CD

on:
  workflow_run:
    workflows:
      - "Frontend CI"
      - "Backend CI"
    types:
      - completed
    branches:
      - main

permissions:
  contents: read

jobs:
  trigger-jenkins:
    name: Trigger Jenkins Deployment

    if: >
      github.event.workflow_run.conclusion == 'success'

    runs-on: ubuntu-latest

    steps:
      - name: Trigger Jenkins
        env:
          JENKINS_URL: ${{ secrets.JENKINS_URL }}
          JENKINS_JOB: ${{ secrets.JENKINS_JOB }}
          JENKINS_USER: ${{ secrets.JENKINS_USER }}
          JENKINS_TOKEN: ${{ secrets.JENKINS_TOKEN }}
          COMMIT_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -e

          echo "========================================"
          echo "After7 Production Deployment"
          echo "========================================"

          echo "Commit:"
          echo "$COMMIT_SHA"

          echo "Triggering Jenkins..."

          CRUMB=$(curl \
            --silent \
            --user "$JENKINS_USER:$JENKINS_TOKEN" \
            "$JENKINS_URL/crumbIssuer/api/json" \
            | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['crumbRequestField'] + ':' + d['crumb'])")

          curl \
            --fail \
            --silent \
            --show-error \
            --user "$JENKINS_USER:$JENKINS_TOKEN" \
            -H "$CRUMB" \
            -X POST \
            "$JENKINS_URL/job/$JENKINS_JOB/buildWithParameters" \
            --data-urlencode "COMMIT_SHA=$COMMIT_SHA"

          echo "Jenkins deployment triggered successfully."

          echo "========================================"
          echo "CD completed"
          echo "========================================"
