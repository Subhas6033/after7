services:
  server:
    build:
      context: ../../Server
      dockerfile: Dockerfile
    image: after7-server:dev
    container_name: after7-server
    restart: unless-stopped

    env_file:
      - ../../Server/.env

    ports:
      - "6866:6866"

    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://127.0.0.1:6866/health"
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

    networks:
      - after7-network

  client:
    build:
      context: ../../Client
      dockerfile: Dockerfile
    image: after7-client:dev
    container_name: after7-client
    restart: unless-stopped

    ports:
      - "3000:3000"

    depends_on:
      server:
        condition: service_healthy

    networks:
      - after7-network

networks:
  after7-network:
    driver: bridge
