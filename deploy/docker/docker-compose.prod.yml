services:
  server:
    image: ${SERVER_IMAGE:-after7-server:latest}

    container_name: after7-server

    restart: unless-stopped

    env_file:
      - /opt/after7/env/server.env

    ports:
      - "5000:5000"

    networks:
      - after7-network

    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://127.0.0.1:5000/health",
        ]

      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  client:
    image: ${CLIENT_IMAGE:-after7-client:latest}

    container_name: after7-client

    restart: unless-stopped

    ports:
      - "3000:3000"

    depends_on:
      server:
        condition: service_healthy

    networks:
      - after7-network

networks:
  after7-network:
    driver: bridge
