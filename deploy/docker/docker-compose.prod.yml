services:
  server:
    image: ${SERVER_IMAGE:-after7-server:latest}

    container_name: after7-server

    restart: unless-stopped

    env_file:
      - /opt/after7/env/server.env

    ports:
      - "127.0.0.1:6866:6866"

    networks:
      - after7-network

    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://127.0.0.1:6866/health"
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

networks:
  after7-network:
    driver: bridge